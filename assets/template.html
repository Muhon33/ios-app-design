<!doctype html>
<!-- iOS mockup starter. Copy this file, keep the frame pieces, replace the content inside .screen.
     URL options: ?theme=dark  (dark mode)   ?bare  (screen only, no bezel, for screenshots) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Name — Screen</title>
<link rel="stylesheet" href="ios.css">
<script>
  // theme + bare mode from the URL (runs before paint)
  (function () {
    var q = new URLSearchParams(location.search);
    if (q.get("theme") === "dark") document.documentElement.dataset.theme = "dark";
    if (q.get("theme") === "light") delete document.documentElement.dataset.theme;
    if (q.has("bare")) document.documentElement.classList.add("is-bare");
  })();
</script>
<style>
  /* Per-app overrides go here: one accent color, maybe a rounded or serif display face. */
  :root { --accent: var(--blue); }
</style>
</head>
<body class="board">

<div class="frame-wrap">
  <p class="board-label">01 · Home</p>
  <div class="iphone grouped">

    <!-- CONTENT LAYER: everything that scrolls -->
    <main class="screen">
      <h1 class="large-title">Title</h1>

      <div class="list-header">Section</div>
      <div class="list">
        <div class="list-body with-icons">
          <a class="row">
            <span class="icon-tile" style="--tile: var(--blue)"><i data-lucide="bell"></i></span>
            <span class="row-text">Notifications</span>
            <span class="row-detail">On</span>
            <svg class="chevron" viewBox="0 0 9 15"><path d="M1.5 1.5 7.5 7.5 1.5 13.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
          <a class="row">
            <span class="icon-tile" style="--tile: var(--green)"><i data-lucide="moon"></i></span>
            <span class="row-text">Focus</span>
            <span class="toggle on"></span>
          </a>
        </div>
      </div>
      <p class="list-footer">Footer text explains the section in one sentence.</p>
    </main>

    <!-- CONTROL LAYER: floats above content -->
    <div class="edge-top"></div>
    <div class="edge-bottom"></div>

    <nav class="nav">
      <span></span>
      <span class="glass-btn glass"><i data-lucide="plus"></i></span>
    </nav>

    <div class="tab-bar-wrap">
      <div class="tab-bar glass">
        <span class="tab active filled"><i data-lucide="house"></i>Home</span>
        <span class="tab"><i data-lucide="layout-grid"></i>Browse</span>
        <span class="tab"><i data-lucide="user-round"></i>Profile</span>
      </div>
      <span class="tab-search glass"><i data-lucide="search"></i></span>
    </div>

    <!-- SYSTEM CHROME: always on top -->
    <div class="status-bar">
      <span>9:41</span>
      <span class="sb-icons">
        <svg width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="7.5" width="3.2" height="4.5" rx="1"/><rect x="5.2" y="5" width="3.2" height="7" rx="1"/><rect x="10.4" y="2.5" width="3.2" height="9.5" rx="1"/><rect x="15.6" y="0" width="3.2" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.4c2.3 0 4.4.9 6 2.4l1.2-1.2A10.2 10.2 0 0 0 8.5.7 10.2 10.2 0 0 0 1.3 3.6l1.2 1.2a8.5 8.5 0 0 1 6-2.4Zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.2a6.8 6.8 0 0 0-9.6 0l1.2 1.2c1-.9 2.2-1.4 3.6-1.4Zm0 3.4c.5 0 1 .2 1.3.5L8.5 11 7.2 9.7c.3-.3.8-.5 1.3-.5Z"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.5"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" opacity=".4"/></svg>
      </span>
    </div>
    <div class="island"></div>
    <div class="home-indicator"></div>
  </div>
</div>

<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
  if (window.lucide) lucide.createIcons();
  if (document.documentElement.classList.contains("is-bare")) document.body.className = "bare";
</script>
</body>
</html>
